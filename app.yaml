# Specify the Python runtime version.
# Use the latest stable version (e.g., python312)
runtime: python312
service: default
# You can choose a different instance class for more power. F2 is a good starting point.
instance_class: F2

# The entrypoint command to run your application.
# It uses Gunicorn to manage Uvicorn workers for an ASGI app.
# The command structure is: gunicorn -w [workers] -k uvicorn.workers.UvicornWorker [module:app]
entrypoint: gunicorn -w 4 -k uvicorn.workers.UvicornWorker main:app